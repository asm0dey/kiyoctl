name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output kiyoctl \
            target/aarch64-apple-darwin/release/kiyoctl \
            target/x86_64-apple-darwin/release/kiyoctl
          tar czf "kiyoctl-${GITHUB_REF_NAME}-macos-universal.tar.gz" kiyoctl

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes kiyoctl-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
