name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # Hoisted out of the step's `if`, where the secrets context is not allowed.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output kiyoctl \
            target/aarch64-apple-darwin/release/kiyoctl \
            target/x86_64-apple-darwin/release/kiyoctl
          ./kiyoctl man man1
          tar czf "kiyoctl-${GITHUB_REF_NAME}-macos-universal.tar.gz" kiyoctl man1

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes kiyoctl-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      # Skipped until TAP_TOKEN exists: a PAT with contents:write on
      # asm0dey/homebrew-tap. github.token cannot write to another repo.
      - name: Point the Homebrew formula at this release
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          sha=$(shasum -a 256 kiyoctl-*.tar.gz | cut -d' ' -f1)
          version=${GITHUB_REF_NAME#v}
          url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kiyoctl-${GITHUB_REF_NAME}-macos-universal.tar.gz

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/asm0dey/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s|^  url .*|  url \"${url}\"|" \
            -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
            Formula/kiyoctl.rb
          git diff --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "kiyoctl ${version}"
          git push
